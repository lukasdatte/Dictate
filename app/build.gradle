plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.ksp)
}

android {
    namespace 'net.devemperor.dictate'
    compileSdkVersion 36

    defaultConfig {
        applicationId "net.devemperor.dictate"
        minSdk 26
        targetSdk 35
        versionCode 30
        versionName "3.2.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            resValue "string", "app_name", "Dictate Debug"
        }
        release {
            resValue "string", "app_name", "Dictate"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig = true
    }

    packagingOptions {
        exclude 'META-INF/DEPENDENCIES'
    }

    sourceSets {
        // Room MigrationTestHelper reads the exported schemas as androidTest
        // assets; without this wiring every migration test fails with
        // "Cannot find schema file DictateDatabase/<n>.json".
        androidTest.assets.srcDirs += files("$projectDir/schemas")
    }

    testOptions {
        // Return default values instead of throwing for unmocked Android APIs
        // (e.g. android.util.Log). Keeps the pure-logic JVM tests light —
        // Robolectric is opt-in per Quality-Gate K-4 (no Android Context
        // unless explicitly justified). Tests under `@RunWith(RobolectricTestRunner)`
        // are unaffected by this flag — they get a real shadow runtime.
        unitTests.returnDefaultValues = true
        // Required for Robolectric: it consumes AAR-bundled resources for
        // tests that need a real Context (channel-order / FGS-budget tests
        // in Block 1 chunk C2 — Spec 1 §10 Phase-B S-5 acceptance).
        unitTests.includeAndroidResources = true
        unitTests.all {
            // The Robolectric inflation suite inflates the full keyboard layout many
            // times; a single test method run accumulates enough shadow state that its
            // fork needs a real heap. Give every fork 2g.
            maxHeapSize = "2g"
            // forkEvery = 1 — one test CLASS per JVM fork (E-T2, desktop-companion-v1
            // Block E repair). Two independent reasons, both requiring hard process
            // isolation, not merely periodic recycling:
            //
            //  1. Robolectric's android-all jar loading opens `jar:` FileSystems via the
            //     JVM-global ZipFileSystemProvider and can leave one open. That map is
            //     per-JVM, so a class that leaks an open FileSystem makes a LATER class in
            //     the same fork throw java.nio.file.FileSystemAlreadyExistsException the
            //     next time the same URI is opened — an order-dependent, non-deterministic
            //     failure surfacing on an unrelated victim (observed:
            //     AndroidKeystoreSecretStoreTest). The leak is inside Robolectric (no
            //     newFileSystem call exists in this codebase), so we cannot close it; the
            //     only guaranteed cure is a fresh JVM per class. Any forkEvery > 1 leaves a
            //     collision window and keeps the flake, so the historical `forkEvery = 80`
            //     (whole suite ≈ one fork) is exactly the high-collision configuration.
            //  2. Shadow-state / heap accumulation across the suite is likewise bounded to a
            //     single class per fork — strictly stronger than the previous periodic
            //     recycle it replaces.
            //
            // Trade-off (per engineering-principles "call out the clever/heavier choice"):
            // a fresh Robolectric bootstrap per class costs wall-clock. CI reliability on a
            // keyboard app is worth more than test minutes here; if the suite grows large
            // enough that speed hurts, add `maxParallelForks` (parallel forks are separate
            // JVMs, so isolation is preserved) — deferred now because each parallel fork
            // holds its own 2g heap and a fixed cap could OOM a small CI runner.
            forkEvery = 1
        }
    }

    lint {
        // KG-SST-4 (Spec 1 §6.1.3): promote EnumSwitch from Warning to
        // Error. Java's switch on a Kotlin enum is not exhaustive — a
        // missing `case` after a new enum variant lands would silently
        // render no badge. The (since converted to Kotlin) HistoryAdapter
        // switch on SessionStatus was the motivating example; the rule
        // stays for the remaining Java switches. Lint reports the
        // missing case as an Error in `./gradlew lintDebug`.
        //
        // Intentional deviation from the spec snippet: `abortOnError`
        // stays at its default (true, see lint-docs) but the build is
        // NOT promoted via `warningsAsErrors`, AND a baseline is NOT
        // generated for the 65 pre-existing lint errors (out-of-scope
        // for C9). Net effect: new EnumSwitch errors will fail
        // `./gradlew lintDebug` once the existing inventory is cleaned
        // up in a separate pass; `./gradlew test` and
        // `./gradlew assembleDebug` are unaffected because they do
        // not run lint.
        error += "EnumSwitch"
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {

    // :shared — the pure kotlin("jvm") protocol/client module (ADR-0015). First
    // consumed here (wd-10): the pairing screen uses PairingUri + DispatchClient.
    implementation project(':shared')
    // :shared-ai — the single AI core, extracted from :app in Block A (ADR
    // adr-shared-ai-module). Package unchanged (net.devemperor.dictate.ai / .database.entity
    // / .preferences / .core stay split across this boundary at jvmTarget 1.8 — no JPMS).
    implementation project(':shared-ai')

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    implementation libs.preference
    implementation libs.emoji2.emojipicker
    // ZXing Android bindings for the pairing QR scanner (wd-10). CAMERA is an
    // optional, runtime-requested permission; manual URL+code entry is equivalent.
    implementation libs.zxing.android.embedded
    testImplementation libs.junit
    // Quality-Gate W-2: real JSONObject/JSONArray/JSONTokener in the JVM
    // unit-test classpath instead of stubs (cf. ElevenLabsKeytermsParserTest
    // line 133-135). Required by VersionedPrefs/Serializer roundtrip tests.
    testImplementation 'org.json:json:20240303'
    // Robolectric — explicit K-4 exception. Block 1 chunk C2 introduces the
    // first user (DictatePipelineServiceTest, FGS lifecycle). Future K-4
    // opt-outs (Spec 2 §11.5 RecordingAnimationController, Spec 3 §14.1
    // DefaultOverlayPermissionGate) reuse the same dep.
    testImplementation libs.robolectric
    // androidx.test:core provides ApplicationProvider — pairs with
    // Robolectric so JVM unit tests can resolve the shadow application
    // context.
    testImplementation libs.androidx.test.core
    // kotlinx-coroutines-test (C7) — provides TestScope + advanceUntilIdle
    // for orchestrator init-order tests (Phase-B S-1 acceptance).
    testImplementation libs.kotlinx.coroutines.test
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // Room migration test helper + JUnit4 rules — required by
    // MigrationTo4Test (Spec 1 §11.4.2). androidTest-scope only;
    // instrumented tests are local-only — no CI invocation today
    // (Spec 1 §11.7.0a "CI-Integration": connectedDebugAndroidTest
    // runs locally on a device/emulator before PR merge).
    androidTestImplementation libs.room.testing
    androidTestImplementation libs.androidx.test.runner
    androidTestImplementation libs.androidx.test.rules

    implementation libs.openai.java
    implementation libs.anthropic.java
    implementation libs.converter.jackson
    implementation libs.commons.validator
    implementation libs.colorpicker

    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler
    // Paging3 for the history list (F-054): incremental loading +
    // background query execution + DiffUtil-based updates. room-paging
    // provides the generated PagingSource behind SessionDao.pagedHistory.
    implementation libs.room.paging
    implementation libs.paging.runtime.ktx
    // WorkManager — background catalog-sync poller (CatalogSyncWorker, peer-katalog.md §6.5).
    // Version pinned + Kotlin-ceiling-verified in libs.versions.toml (`work`, D5.f / ADR-0015 R4).
    implementation libs.work.runtime.ktx

    // Coroutines + Lifecycle (for StateFlow-based ActiveJobRegistry / ViewModels)
    implementation libs.kotlinx.coroutines.android
    // kotlin-reflect — required by DictateOrchestrator + DictateModuleRegistry
    // for `KClass.sealedSubclasses` iteration (Spec 1 §4.3 + ADR-0001).
    implementation libs.kotlin.reflect
    // kotlinx-collections-immutable — DictateUiState.pendingSessions uses
    // PersistentList for structurally-shared immutability (Spec 1 §3 F-9).
    implementation libs.kotlinx.collections.immutable
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.livedata.ktx
}
