plugins {
    alias(libs.plugins.kotlin.jvm)
    alias(libs.plugins.kotlin.serialization)
    alias(libs.plugins.compose)
    alias(libs.plugins.compose.compiler)
    alias(libs.plugins.sqldelight)
}

sqldelight {
    databases {
        DictateCompanionDb {
            packageName = "net.devemperor.dictate.companion.db"
            dialect libs.sqldelight.sqlite.dialect
            // Armed (wd-5). `verifySqlDelightMigration` replays every .sqm against the checked-in
            // schema snapshot in `databases/` and compares the result with the current .sq — so a
            // schema change that forgets its migration cannot merge. The SQLDelight equivalent of
            // Room's exportSchema + MigrationTestHelper.
            verifyMigrations = true
            schemaOutputDirectory = file("src/main/sqldelight/databases")
        }
    }
}

// JVM 17 — the companion is a desktop app and shares nothing with Android's
// jvmTarget-1.8 constraint. Ktor's server needs JDK 11+; Compose Desktop wants 17.
java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

// No `repositories { }` block here — settings.gradle sets FAIL_ON_PROJECT_REPOS.

dependencies {
    implementation project(':shared')
    // :shared-ai owns the AI error/provider taxonomy (AIProviderException.ErrorType, AIProvider) and,
    // from D1b onward, the transcription/completion runners the desktop pipeline calls. Needed here
    // already because `sessions.last_error_type` is a Double-Enum column typed `AS
    // AIProviderException.ErrorType` — the shared taxonomy, never redefined companion-side
    // (desktop-host.md §3.2). It also carries the SecretStore port
    // (net.devemperor.dictate.ai.secrets), which both platform hosts implement (spec secretstore.md
    // §4.1); the fuller AI-pipeline consumption follows in Block D. A pure Kotlin/JVM module
    // (SharedAiPurityTest), so this JVM-17 consumer takes its 1.8 bytecode without issue.
    implementation project(':shared-ai')

    implementation compose.desktop.currentOs
    implementation compose.material3
    // The Material icon set. Compose Multiplatform ships no icons with material3 itself, and the
    // navigation rail, the search field and the banner all want one.
    implementation compose.materialIconsExtended

    implementation libs.ktor.server.core
    implementation libs.ktor.server.cio
    implementation libs.ktor.server.content.negotiation
    implementation libs.ktor.server.status.pages
    implementation libs.ktor.server.call.logging
    implementation libs.ktor.serialization.kotlinx.json

    implementation libs.sqldelight.sqlite.driver
    implementation libs.sqldelight.primitive.adapters
    implementation libs.sqlite.jdbc

    implementation libs.jna
    implementation libs.jna.platform

    implementation libs.zxing.core
    implementation libs.zxing.javase

    testImplementation libs.junit
    testImplementation libs.ktor.server.test.host
    // OkHttp is on the runtime classpath through :shared (implementation), but the E2E suite needs
    // it at COMPILE time: it builds an impatient OkHttpClient to provoke a read timeout against the
    // real server. Without that, "a timeout is Unreachable, never Delivered" is untested.
    testImplementation libs.okhttp
    // The pairing CLI (cli/PairCli.kt) constructs OkHttpDispatchTransport directly, whose default
    // parameter exposes OkHttpClient in its signature — hence a main-source dependency too.
    implementation libs.okhttp
}

compose.desktop {
    application {
        mainClass = "net.devemperor.dictate.companion.MainKt"
        nativeDistributions {
            // jpackage CANNOT cross-compile — it builds for the HOST OS only (JEP 392). No
            // configuration makes an .msi appear on this Linux VM, and `packageMsi` fails here by
            // design. Deb is configured so that the packaging path itself stays exercisable on the
            // dev VM: `createDistributable` + `packageDeb` are the Linux proof that the bundle is
            // well-formed, and Windows then only adds WiX. See docs/runbooks/companion-windows-release.md.
            targetFormats(
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Msi,
                org.jetbrains.compose.desktop.application.dsl.TargetFormat.Deb
            )
            // The jlink runtime is built from an explicit module list. Compose's defaults cover the
            // UI (java.desktop, java.prefs, …) but NOTHING else: without java.sql the very first
            // thing main() does — CompanionContainer.production() opening the SQLite database —
            // dies with NoClassDefFoundError: java/sql/DriverManager. The jpackage GUI launcher has
            // no console, so that surfaces as a bare "Failed to launch JVM" dialog with no hint
            // whatsoever. Keep this list in sync via `./gradlew :companion:suggestRuntimeModules`
            // (jdeps) whenever a dependency is added. See the runbook's Troubleshooting section.
            modules("java.instrument", "java.management", "java.sql", "jdk.unsupported")

            packageName = "DictateCompanion"
            packageVersion = "1.0.0"
            description = "Dictate Companion — receives dictated text from the phone"
            vendor = "devemperor"

            linux {
                iconFile.set(project.file("src/main/resources/icon.png"))
            }

            windows {
                // FROZEN. Generated once, on 2026-07-13, and it must NEVER change: Windows Installer
                // identifies a product by this GUID. A new one makes the next MSI install *alongside*
                // the old companion instead of upgrading it — two apps fighting over port 8756, and
                // the user with no idea why.
                upgradeUuid = "B9083816-3022-4502-B5F3-7CDA7BA722D8"
                menuGroup = "Dictate"
                // The installer offers both; neither is forced on the user.
                menu = true
                shortcut = true
                // No .ico is shipped yet, so jpackage uses its default icon. Cosmetic, and it is
                // listed in the release runbook next to the other known state of an unsigned build.
            }
        }
    }
}

// Headless pairing/dispatch smoke-test client — see cli/PairCli.kt for why this exists.
tasks.register('pairCli', JavaExec) {
    group = 'tools'
    description = 'Pair with a running companion and send test dispatches (--args="pair <uri> …")'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'net.devemperor.dictate.companion.cli.PairCliKt'
}
