[versions]
agp = "8.13.2"
kotlin = "2.1.20"
ksp = "2.1.20-1.0.32"
room = "2.6.1"
colorpicker = "0.0.15"
commonsValidator = "1.10.1"
converterJackson = "3.0.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.13.0"
activity = "1.11.0"
constraintlayout = "2.2.1"
openaiJava = "4.26.0"
anthropicJava = "2.16.0"
preference = "1.2.1"
emojiPicker = "1.6.0"
kotlinxCoroutines = "1.7.3"
# kotlinx-collections-immutable — required for DictateUiState.pendingSessions
# (PersistentList, ~50 KB APK impact). See Spec 1 §3 F-9 architecture correction.
kotlinxCollectionsImmutable = "0.3.7"
lifecycle = "2.7.0"
# Paging3 — history-list pagination (F-054, docs/research/
# "2026-07-02 - history-pagination-and-scale.md" §2.1). Runtime-ktx for
# PagingDataAdapter + Flow<PagingData>; room-paging (versioned with Room)
# generates the PagingSource implementation for SessionDao.pagedHistory.
paging = "3.3.6"
# Robolectric — explicit Quality-Gate K-4 exception for FGS / Service /
# IME-lifecycle / DB-migration tests where an Android Context is
# unavoidable (state file §"Test-Strategy"). Block 1 chunk C2 is the
# first user (DictatePipelineServiceTest — channel-order + FGS budget
# acceptance per Spec 1 §10 Phase-B S-5). Pinned to a version that
# supports compile/target sdk 35 (4.13+ for SDK 34+; 4.14 for SDK 35).
robolectric = "4.14.1"
androidxTestCore = "1.6.1"
# androidx.test runner + rules — required for instrumented tests
# (Block 3 introduces the first androidTest source set; see Spec 1
# §11.7.0a "androidTest-Setup"). Test-scope only.
androidxTestRunner = "1.5.2"
androidxTestRules = "1.5.0"

# ── Windows-Dispatch (:shared + :companion) ─────────────────────────────────
# Version policy (BINDING, ADR-0015): no library that is built with Kotlin > 2.1.20.
# The Kotlin compiler rejects metadata from newer Kotlin versions, so every
# coordinate below is pinned to the last line released against the 2.1.20 series.
# Lifting these requires lifting `kotlin` first — a separate work package.
#
# Compose Multiplatform Desktop — 1.8.x is the line that targets Kotlin 2.1.20.
# 1.9+/1.10+/1.11+ are built with Kotlin 2.2 → metadata reject on 2.1.20.
composeMultiplatform = "1.8.2"
# Ktor 3.1.x targets Kotlin 2.1.20. ONLY used in :companion — the server needs
# JDK 11+, while :shared stays on jvmTarget 1.8 for :app (ADR-0015/0017).
ktor = "3.1.3"
kotlinxSerialization = "1.8.0"
# Konform — validation DSL with no reflection, no codegen, no runtime deps.
# Wire-format constraints live next to the DTOs as the single source of truth (ADR-0016).
konform = "0.11.1"
# OkHttp — the blocking HTTP client of :shared. Already present transitively via the
# OpenAI/Anthropic SDKs; the explicit pin prevents drift between the modules.
okhttp = "4.12.0"
# SQLDelight 2.1.x — last line before 2.2.x (Kotlin-2.2-built).
sqldelight = "2.1.0"
sqliteJdbc = "3.45.3.0"
jna = "5.19.1"
zxing = "3.5.4"
# ZXing Android bindings for the pairing QR scanner (:app only). mavenCentral, Java-8,
# minSdk-compatible. Deferred from Block 1 to the chunk that actually consumes it (wd-10).
zxingAndroidEmbedded = "4.3.0"

[libraries]
colorpicker = { module = "com.github.QuadFlask:colorpicker", version.ref = "colorpicker" }
commons-validator = { module = "commons-validator:commons-validator", version.ref = "commonsValidator" }
converter-jackson = { module = "com.squareup.retrofit2:converter-jackson", version.ref = "converterJackson" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
openai-java = { module = "com.openai:openai-java", version.ref = "openaiJava" }
anthropic-java = { module = "com.anthropic:anthropic-java", version.ref = "anthropicJava" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
# Room ↔ Paging3 bridge — lets @Query methods return PagingSource<Int, T>.
room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
paging-runtime-ktx = { module = "androidx.paging:paging-runtime-ktx", version.ref = "paging" }
preference = { group = "androidx.preference", name = "preference", version.ref = "preference" }
emoji2-emojipicker = { module = "androidx.emoji2:emoji2-emojipicker", version.ref = "emojiPicker" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "kotlinxCoroutines" }
# kotlinx-coroutines-test — TestScope / UnconfinedTestDispatcher /
# advanceUntilIdle for orchestrator-init order tests added in C7.
# Test-scope only.
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
# kotlin-reflect — required by DictateOrchestrator.collectLeaves +
# DictateModuleRegistry.validate, both of which iterate
# `KClass.sealedSubclasses` to build the routing map at init
# (Spec 1 §4.3 + ADR-0001 §"Required mechanics" item 5). Adds ~3 MB to
# the APK — accepted as the cost of compile-time-safe action routing.
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "kotlinxCollectionsImmutable" }
lifecycle-viewmodel-ktx = { module = "androidx.lifecycle:lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-livedata-ktx = { module = "androidx.lifecycle:lifecycle-livedata-ktx", version.ref = "lifecycle" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidxTestCore" }
# Room migration-test helper (MigrationTestHelper rule) — needed by
# MigrationTo4Test (instrumented). Test-scope only.
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
# Instrumented-test runner + JUnit4 rules. Test-scope only.
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }

# ── Windows-Dispatch ────────────────────────────────────────────────────────
# :shared — wire format + validation + blocking HTTP client.
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
konform = { module = "io.konform:konform-jvm", version.ref = "konform" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
# MockWebServer — real HTTP (headers, timeouts, truncated responses) in :shared's tests.
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "okhttp" }
# :companion — Ktor CIO server. NEVER add these to :shared or :app.
ktor-server-core = { module = "io.ktor:ktor-server-core-jvm", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio-jvm", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation-jvm", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages-jvm", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging-jvm", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json-jvm", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host-jvm", version.ref = "ktor" }
# :companion — local SQLite history.
sqldelight-sqlite-driver = { module = "app.cash.sqldelight:sqlite-driver", version.ref = "sqldelight" }
# The SQL dialect the .sq files are compiled against. SQLDelight defaults to SQLite 3.18, which
# predates UPSERT (`ON CONFLICT ... DO UPDATE`, SQLite 3.24) — and the idempotent history write is
# built on exactly that. 3.38 is comfortably below what sqlite-jdbc 3.45 ships, so the dialect the
# compiler checks against and the engine that runs the statement agree.
sqldelight-sqlite-dialect = { module = "app.cash.sqldelight:sqlite-3-38-dialect", version.ref = "sqldelight" }
sqldelight-primitive-adapters = { module = "app.cash.sqldelight:primitive-adapters", version.ref = "sqldelight" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqliteJdbc" }
# :companion — Win32 text insertion (User32.SendInput) + HKCU autostart registry key.
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
# :companion — pairing QR. `javase` renders the BitMatrix into a BufferedImage.
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
zxing-javase = { module = "com.google.zxing:javase", version.ref = "zxing" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingAndroidEmbedded" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
# The Compose compiler plugin version MUST equal the Kotlin version (Kotlin 2.0+).
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
